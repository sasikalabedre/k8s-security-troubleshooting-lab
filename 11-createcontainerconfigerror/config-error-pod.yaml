apiVersion: v1
kind: Pod
metadata:
  name: config-error-demo
  namespace: k8s-hardening
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: missing-app-secret
              key: password
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
