apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-pod
  namespace: k8s-hardening
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: app-secret
          mountPath: /etc/app-secrets
          readOnly: true
  volumes:
    - name: app-secret
      secret:
        secretName: app-credentials
        defaultMode: 0440
