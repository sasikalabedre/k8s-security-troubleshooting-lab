apiVersion: v1
kind: Pod
metadata:
  name: oomkilled-demo
  namespace: k8s-hardening
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: polinux/stress
      command: ["stress"]
      args: ["--vm", "1", "--vm-bytes", "100M", "--vm-hang", "1"]
      resources:
        requests:
          memory: "16Mi"
        limits:
          memory: "32Mi"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
