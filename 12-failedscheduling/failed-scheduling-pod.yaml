apiVersion: v1
kind: Pod
metadata:
  name: failed-scheduling-demo
  namespace: k8s-hardening
spec:
  nodeSelector:
    kubernetes.io/hostname: minikube-m02
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
